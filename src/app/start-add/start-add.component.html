<div class="card" [class.embedded-assignment-form]="embedded">
    <span *ngIf="!embedded" class="text-900 text-xl font-bold mb-4 block">Lisamine</span>

    <div class="grid formgrid p-fluid">
        <div class="field mb-4 col-12" *ngIf="!embedded">
            <label for="camera" class="font-medium text-900">Failid</label>
            <div class="button-container">
                <div class="trigger" (click)="openCameraDialog()">
                    <i class="pi pi-camera"></i>
                    <span>Tee pilt</span>
                </div>
                <div class="trigger" (click)="fileInput.click()">
                    <i class="pi pi-upload"></i>
                    <span>Vali fail</span>
                    <input type="file" #fileInput (change)="onFileSelected($event)" hidden>
                </div>
            </div>
        </div>

        <div class="field mb-4 col-12" *ngIf="images.length > 0 && !embedded">
            <label for="uploadedFiles" class="font-medium text-900">Failid</label>
            <div class="uploaded-files">
                <div class="file-item" *ngFor="let image of images">
                    <img [src]="image" alt="Extracted Image" class="uploaded-image" (click)="onImageClick(image)">
                </div>
            </div>
        </div>

        <div class="field mb-4 col-12" *ngIf="!embedded">
            <h5>Projekt</h5>
            <p-dropdown
                inputId="project"
                [options]="projectOptions"
                [(ngModel)]="selectedProject"
                (onChange)="onProjectChange($event)"
                optionLabel="projectName"
                [filter]="true"
                placeholder="Vali projekt">
            </p-dropdown>
        </div>

        <div class="field mb-4 col-12 md:col-6">
            <h5>Tüüp</h5>
            <p-dropdown
                inputId="assignmentType"
                [options]="typeOptions"
                [(ngModel)]="selectedType"
                (onChange)="onTypeChange($event)"
                optionLabel="displayName"
                placeholder="Vali tüüp">
            </p-dropdown>
        </div>

        <div class="field mb-4 col-12 md:col-6">
            <h5>Vastutaja</h5>
            <p-dropdown
                inputId="vastutaja"
                [options]="responsibleOptions"
                [(ngModel)]="selectedResponsibleUser"
                [filter]="true"
                placeholder="Vali vastutaja">
                <ng-template let-user pTemplate="selectedItem">
                    <span>{{userLabel(user)}}</span>
                </ng-template>
                <ng-template let-user pTemplate="item">
                    <div>{{userLabel(user)}} <span *ngIf="user.company">· {{user.company}}</span></div>
                </ng-template>
            </p-dropdown>
        </div>

        <div class="field mb-4 col-12 md:col-6">
            <h5>Asukoht</h5>
            <p-dropdown
                inputId="asukoht"
                [options]="addressOptions"
                [(ngModel)]="selectedAddress"
                (onChange)="onAddressChange($event)"
                optionLabel="name"
                [filter]="true"
                placeholder="Vali aadress">
            </p-dropdown>
        </div>

        <div class="field mb-4 col-12 md:col-6">
            <h5>Sektor</h5>
            <p-dropdown
                inputId="sector"
                [options]="sectorOptions"
                [(ngModel)]="selectedSector"
                optionLabel="name"
                [filter]="true"
                placeholder="Vali sektor">
            </p-dropdown>
        </div>

        <div class="field mb-4 col-12 md:col-6">
            <h5>Teema</h5>
            <input pInputText type="text" [(ngModel)]="theme">
        </div>

        <div class="field mb-4 col-12 md:col-6">
            <h5>ATV</h5>
            <input id="atv" type="text" pInputText [(ngModel)]="atv">
        </div>

        <div class="field mb-4 col-12">
            <h5>Kirjeldus</h5>
            <textarea rows="5" pInputTextarea [(ngModel)]="description"></textarea>
        </div>

        <div class="field col-12" *ngIf="!embedded">
            <button
                pButton
                pRipple
                label="Salvesta"
                icon="pi pi-check"
                class="p-button-success"
                (click)="saveStandaloneAssignment()">
            </button>
        </div>
    </div>
</div>

<p-dialog #cameraDialog header="Capture Image" [(visible)]="displayCameraDialog" [modal]="true" [style]="{width: '80vw', height: '80vh'}" (onShow)="onDialogShow(cameraDialog)">
    <app-camera-capture></app-camera-capture>
</p-dialog>

<p-dialog #imageDialog header="View Image" [(visible)]="displayImageDialog" [modal]="true" [style]="{width: dynamicWidth, height: dynamicHeight}" (onHide)="closeImageDialog()">
    <app-image-dialog [imageUrl]="selectedImage" [type]="'DF'" (imageLoaded)="onImageLoaded($event)"></app-image-dialog>
</p-dialog>
